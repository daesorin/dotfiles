# VIDEO AND PERFORMANCE
# use gpu for video output
vo=gpu
# enable safe hardware decoding to reduce cpu usage
hwdec=auto-safe
# keep the player window open after the file finishes
keep-open=yes

# AUDIO BEHAVIOUR
# default startup volume
volume=100
# maximum volume boost
volume-max=150
# maintain original audio pitch when changing playback speed
audio-pitch-correction=yes

# SUBTITLES AND LANGUAGES
# prefer english audio
alang=en,eng
# prefer english subtitles
slang=en,eng
# set subtitle text colour to white
sub-color="#FFFFFFFF"
# scale subtitles relative to window size
sub-scale-with-window=yes
