# STARSHIP CORE CONFIGURATION
format = "$hostname$character"

[hostname]
ssh_only = true
format = "[$hostname](blue) "

# PROMPT CHARACTER
[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vicmd_symbol = "[v](bold green)"

# EXECUTION TIME
[cmd_duration]
min_time = 2000
format = "took [$duration](yellow) "
