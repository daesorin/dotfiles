# MAIN SETTINGS
[main]
shell=bash
font=JetBrainsMono Nerd Font:size=9

# SCROLLBACK BUFFER
[scrollback]
lines=10000

# WINDOW DECORATIONS
[csd]
preferred=none

# CURSOR APPEARANCE
[cursor]
style=block
blink=yes
blink-rate=500

# COLOUR PALETTE
[colors-dark]
alpha=1.0
background=0c0c0c
foreground=c0c0c0
selection-foreground=000000
selection-background=666666

# ANSI COLOURS
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

# BRIGHT COLOURS
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2
