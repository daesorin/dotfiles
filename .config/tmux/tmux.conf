# CORE ENVIRONMENT
# reassign prefix to ctrl-a for ergonomic efficiency
set -g prefix C-b
bind C-b send-prefix

# start window and pane numbering at 1 to align with sway workspaces
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# enable true colour support for alacritty and flexoki
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc"

# enable mouse control for pane manipulation
set -g mouse on

# use vi keybindings in copy mode
set-window-option -g mode-keys vi

# STATUS BAR
# relocate status bar to the top
set-option -g status-position top

# align the window list to the right axis
set-option -g status-justify right

# flexoki ink dark colour palette
set -g status-style bg="#100f0f",fg="#cecdc3"

# standardise window status formatting
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style bg="#282726",fg="#8b7ec8",bold

# eliminate the time module on the right
set -g status-right ""

# clean the left side session indicator
set -g status-left " [#S] "
set -g status-left-length 20

# clean the left side session indicator
set -g status-left " [#S] "
set -g status-left-length 40
