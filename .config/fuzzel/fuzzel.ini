# THE NOIR THEME: FUZZEL

[main]
# Fuzzel does not support per-mode prompts dynamically without wrapper scripts.
prompt="APP: "
font=JetBrainsMono Nerd Font:size=8
# Character width is used instead of percentage. 50 is a reasonable baseline.
width=50
lines=8
icons-enabled=yes
terminal=footclient
# Disabling the generic exit button to maintain the sharp aesthetic.
exit-on-keyboard-focus-loss=yes

[colors]
# Catppuccin Mocha translations mapped from your Rofi config
background=141414ff
text=cdd6f4ff
match=b4befeff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=b4befeff
border=b4befeff

[border]
width=1
radius=0
